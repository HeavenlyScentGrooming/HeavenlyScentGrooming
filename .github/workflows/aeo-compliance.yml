# AEO Site Protocol v2.1.0 compliance gate.
#
# Generated by the site-audit skill. Scripts are vendored under .aeo/ so this
# runs with no third-party actions and no package installs, keeping the
# protocol's zero-dependency rule intact.
#
# The "no visual change" job is the one that makes this safe on a client site:
# it fails the build if a compliance change would alter what a visitor sees.
#
# The live job is advisory for now (continue-on-error). Promote it to blocking
# once the outstanding live issues for this site are resolved.

name: AEO compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SITE_ROOT: "."
  SITE_HOST: "heavenlyscentgrooming.com"

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protocol compliance
        run: |
          python3 .aeo/verify_aeo.py \
            --root "$SITE_ROOT" --host "$SITE_HOST" --site "${{ github.repository }}"

      - name: No visual change
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          python3 .aeo/verify_no_visual_change.py --repo . --base "origin/${{ github.base_ref }}"

  live:
    runs-on: ubuntu-latest
    needs: compliance
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deploy to propagate
        run: sleep 60

      - name: Verify live origin
        run: |
          python3 .aeo/verify_aeo.py \
            --root "$SITE_ROOT" --host "$SITE_HOST" --live \
            --site "${{ github.repository }} (live)"

      - name: Assert no managed robots.txt override
        run: |
          body="$(curl -fsSL "https://$SITE_HOST/robots.txt" || true)"
          if grep -qi "Cloudflare Managed" <<<"$body"; then
            echo "::error::Managed robots.txt is overriding the repo file at the edge."
            exit 1
          fi
          if grep -qi "<!doctype html" <<<"$body"; then
            echo "::error::robots.txt is serving HTML; the static file is not being found."
            exit 1
          fi
          echo "robots.txt serves clean."
