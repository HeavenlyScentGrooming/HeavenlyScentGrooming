# Optional: use with `npx wrangler pages dev .` after binding D1 as DB in the dashboard.
# Production bindings (D1, env vars, cron) are usually set in the Cloudflare dashboard for this project.

name = "heavenlyscentgrooming"
compatibility_date = "2025-04-13"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "hsg-leads"
database_id = "1f97b12b-e938-4f7c-a3d8-6c9adcd6ffa9"

